# Pull-request quality gate.
#
# Deliberately references NO secrets. That is what makes it safe to run on pull
# requests from forks: a malicious PR cannot exfiltrate a provider key from a
# workflow that was never given one. Every job here works from recorded
# fixtures, which is the whole reason mock mode exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only. This workflow never writes to the repository.
permissions:
  contents: read

# One run per branch. A new push supersedes an in-flight run rather than
# queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so the pinned version lives in exactly one place.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Benchmark runs end to end without any API key
        # The seed makes this reproducible; the absence of provider secrets in
        # this workflow makes it a real test of the keyless path.
        env:
          BENCH_SEED: '1'
        run: npm run bench -- run --mock --out /tmp/ci-run.json

  data:
    name: Validate committed data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate every run file against the schema
        # Names the offending file and the JSON pointer, so a contributor who
        # hand-edited a run file learns exactly what is wrong.
        run: npm run data:validate

      - name: Check data/index.json is up to date
        # The manifest is committed and generated. Regenerating it must produce
        # no diff; a diff means a run file was added without refreshing it.
        run: |
          npm run data:index
          if ! git diff --exit-code data/index.json; then
            echo "::error::data/index.json is stale. Run 'npm run data:index' and commit the result."
            exit 1
          fi

  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Uploaded so the accessibility job can check the real built output
      # rather than rebuilding it.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  a11y:
    name: Accessibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Install the browser axe runs in
        run: npx playwright install --with-deps chromium

      - name: Run axe over every built page
        run: npm run test:a11y

      - name: Check the client JavaScript budget
        run: npm run test:budget

  lighthouse:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Assert performance, accessibility, best-practices and SEO all 95+
        run: npx lhci autorun
