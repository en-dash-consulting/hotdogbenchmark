# Cloudflare Workers deployment for the benchmark proxy.
#
# Secrets are set with `wrangler secret put`, never in this file:
#   wrangler secret put SESSION_SECRET
#   wrangler secret put OIDC_CLIENT_SECRET   # only for a confidential client
#
# See docs/proxy.md for the full deployment procedure and the threat model.
name = "hotdogbenchmark-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Non-secret configuration. Override per environment.
OIDC_ISSUER = "https://id.endash.example"
OIDC_CLIENT_ID = "hotdogbenchmark"
OIDC_REDIRECT_URI = "https://hotdogbenchmark-proxy.workers.dev/auth/callback"
SITE_ORIGIN = "https://hotdogbenchmark.lol"
SESSION_TTL_SECONDS = "3600"

# Rate-limit counters. Optional: without it the limiter falls back to an
# in-memory map, which is per-isolate and therefore approximate.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<created with: wrangler kv namespace create RATE_LIMIT>"
