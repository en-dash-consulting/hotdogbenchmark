name: Add a model or provider
description: Propose a model to benchmark, or a whole new provider to support.
labels: ['add-model']
body:
  - type: markdown
    attributes:
      value: |
        Adding a **model** to a provider we already support is a `models.json` edit.
        Adding a **provider** is one new adapter file. Both are documented in
        [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md) — you are very welcome to open the
        pull request yourself instead of filing this.

        Only the kind and the model id are required. The rest is what `models.json` needs
        before the entry can be trusted; fill in what you know and a maintainer will verify
        the rest against the provider's documentation.

  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing?
      options:
        - A new model on a provider already supported
        - A new provider (needs a new adapter)
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider id
      description: >
        The adapter id as `npm run bench -- providers` lists it (anthropic, openai, gemini,
        xai, mistral, deepseek, llama-hosted). For a new provider, propose one.
      placeholder: anthropic
    validations:
      required: false

  - type: input
    id: vendor
    attributes:
      label: Vendor
      description: >
        Who made the model, as shown in the report. If someone else serves it, say both:
        "Meta (served by Together AI)".
      placeholder: Anthropic
    validations:
      required: false

  - type: input
    id: model-id
    attributes:
      label: Exact model ID
      description: >
        The literal string the API expects. Read it from the provider's live model-listing
        endpoint where one exists; do not retype it from memory.
      placeholder: claude-opus-5
    validations:
      required: true

  - type: input
    id: display-name
    attributes:
      label: Display name
      description: The human name shown in the report.
      placeholder: Claude Opus 5
    validations:
      required: false

  - type: input
    id: docs-url
    attributes:
      label: Documentation URL
      description: The page you copied that model ID from. This gets recorded in models.json.
    validations:
      required: false

  - type: input
    id: input-price
    attributes:
      label: Input price, USD per million tokens
      description: The number that goes in `pricing.inputUsdPerMTok`.
      placeholder: '5'
    validations:
      required: false

  - type: input
    id: output-price
    attributes:
      label: Output price, USD per million tokens
      description: >
        The number that goes in `pricing.outputUsdPerMTok`. If reasoning tokens are billed at
        the output rate but reported separately, say so under "Anything else".
      placeholder: '25'
    validations:
      required: false

  - type: input
    id: pricing-url
    attributes:
      label: Pricing URL
      description: >
        Where per-token pricing is published. Cost estimates are stamped with the date the
        price was read, so this link matters.
    validations:
      required: false

  - type: dropdown
    id: streaming
    attributes:
      label: Does the API support streaming responses?
      description: Streaming is how time-to-first-token gets measured. Without it, ttfb is null.
      options:
        - 'Yes'
        - 'No'
        - Not sure
    validations:
      required: false

  - type: dropdown
    id: usage-reporting
    attributes:
      label: Does the API report token usage?
      description: Input and output token counts in the response body.
      options:
        - 'Yes, input and output'
        - 'Yes, and also reasoning or cached tokens'
        - 'No'
        - Not sure
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Free tier, rate limits, minimum spend, or quirks in the wire format worth knowing about.
