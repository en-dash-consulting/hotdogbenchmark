name: Add a question
description: Propose a question for the models to answer in every edition.
labels: ['add-question']
body:
  - type: markdown
    attributes:
      value: |
        Only the question itself is required. The other fields map onto the entry in
        `questions.json`; fill in what you know and a maintainer will do the rest. You are
        very welcome to open the pull request yourself; see
        [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md#adding-a-question).

        A new question does not have to be about sandwiches, but the shipped framings in
        `conditions.json` are. If yours has a different shape, say so in the "why" field.

        What happens next: an accepted question is added to `questions.json` as `proposed`
        and appears on the site under "Up next" with your credit, if you want one, before it
        is switched live and asked in an edition.

  - type: input
    id: text
    attributes:
      label: The question, exactly as the models would receive it
      description: >
        Must end with "One word answer." That suffix is what makes the one-word compliance
        metric mean anything, and the schema rejects a question without it.
      placeholder: Is a burrito a sandwich? One word answer.
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: Subject
      description: >
        The thing being asked about, lowercase, with its article, so it drops into a sentence.
        The framings use it: "{subject} is a sandwich." becomes "A burrito is a sandwich."
      placeholder: a burrito
    validations:
      required: false

  - type: input
    id: slug
    attributes:
      label: Proposed id
      description: >
        A lowercase slug, letters, digits and single dashes. It appears in URLs and run files,
        and with dashes read as spaces it must appear in the question text.
      placeholder: burrito
    validations:
      required: false

  - type: input
    id: report-title
    attributes:
      label: Report title
      description: The heading of the question's report page. Short, and its own.
      placeholder: The Burrito Question
    validations:
      required: false

  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: One line under the title saying what makes this question worth asking.
      placeholder: Bread on all sides. Massachusetts said no in 2006.
    validations:
      required: false

  - type: textarea
    id: why
    attributes:
      label: Why is it interesting?
      description: >
        What do you expect the models to disagree about, and what would a framing arm show?
        Every question costs models times framings times samples calls a week, so it has to
        earn its place.
    validations:
      required: false

  - type: input
    id: credit-name
    attributes:
      label: How should you be credited?
      description: >
        The name shown as "Sent in by …" on the question's report and in "Up next". Leave it
        blank to use your GitHub handle. If you would rather not be named, tick the box below.
      placeholder: Ada Lovelace
    validations:
      required: false

  - type: input
    id: credit-url
    attributes:
      label: A link for the credit (optional)
      description: Your site or profile, linked from your name.
      placeholder: https://example.com
    validations:
      required: false

  - type: checkboxes
    id: credit-opt-out
    attributes:
      label: Credit
      description: >
        Nothing is shown unless you say so here or above. Silence is not consent to be named.
      options:
        - label: Do not credit me. Leave the question uncredited.
          required: false
        - label: Credit me as above.
          required: false
